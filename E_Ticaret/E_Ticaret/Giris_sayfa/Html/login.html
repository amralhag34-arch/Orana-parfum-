<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gieiş yap</title>
    <link rel="icon" href="../img/favicon.png" type="image/png">


    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../Css/style.css">
    <script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body>
    
    <div class="login-container">
        <div class="logo">
            <h1>Orana Parfum</h1>  <!-- اسم الموقع-->
            <p>E Ticaret hoş geldiniz</p> <!-- duzgun yaz -->
        </div>

        <form id="loginForm">
            <div class="form-group">
                <label for="email"> emil</label>                          <!-- duzgun yaz -->
                <input type="email" id="email" name="email" placeholder=" emil  girin" required>
                <div class="error-message" id="emailError"></div>
            </div>
            <div class="form-group">
                <label for="password"> password </label>                           <!-- duzgun yaz -->
                <input type="password" id="password" name="password" placeholder=" password girin " required>
                <div class="error-message" id="passwordError"></div>
            </div>
            <button type="submit" class="login-btn">Giriş Yap </button>
        </form>
        
        <div class="divider">
            <span>veya</span>
        </div>

        <div class="google-btn-container">
            <div id="g_id_onload"
                data-client_id="YOUR_GOOGLE_CLIENT_ID"
                data-context="signin"
                data-ux_mode="popup"
                data-callback="handleGoogleSignIn"
                data-auto_select="false"
                data-itp_support="true">
            </div>
            
            <div class="g_id_signin"
                data-type="standard"
                data-shape="rectangular"
                data-theme="outline"
                data-text="signin_with"
                data-size="large"
                data-logo_alignment="center"
                data-width="100%">
            </div>
        </div>

        <div class="forgot-password">
            <a href="yeni-sifre.html">Şifremi Unuttum</a>
        </div>
        <div class="additional-links">
            <p>Hesabınız yok mu? <a href="Yeni-Hesap.html">Yeni Hesap Oluştur</a></p>
        </div>


    </div>
    
</body>
</html>
