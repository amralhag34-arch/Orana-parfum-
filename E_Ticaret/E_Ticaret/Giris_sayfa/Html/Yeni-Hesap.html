<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../Css/style.css">
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <title>Yeni Hesap</title>
</head>
<body>

    <div class="login-container">

        <div class="logo">
            <h1>Orana Parfum</h1>
            <p>Yeni Hesap Oluştur</p>

            <form id="registerForm">

                <div class="form-group">
                    <label for="fullName">Ad girin</label>
                    <input type="text" id="fullName" name="fullName" placeholder="Adınızı ve soyadınızı girin" required>
                    <div class="error-message" id="fullNameError"></div>
                </div>

                <div class="form-group">
                    <label for="email">e bost girin</label>
                    <input type="email" id="email" name="email" placeholder="E-posta adresinizi girin" required>
                    <div class="error-message" id="emailError"></div>
                </div>

                <div class="form-group">
                    <label for="password">Şifre</label>
                    <input type="password" id="password" name="password" placeholder="Şifrenizi girin" required>
                    <div class="error-message" id="passwordError"></div>
                </div>

                <button type="submit" class="login-btn">Kayıt Ol</button>

            </form>

            
        <div class="divider">
            <span>veya</span>
        </div>

        <div class="google-btn-container">
            <div id="g_id_onload"
                data-client_id="YOUR_GOOGLE_CLIENT_ID"
                data-context="signup"
                data-ux_mode="popup"
                data-callback="handleGoogleSignIn"
                data-auto_select="false"
                data-itp_support="true">
            </div>
            
            <div class="g_id_signin"
                data-type="standard"
                data-shape="rectangular"
                data-theme="outline"
                data-text="signup_with"
                data-size="large"
                data-logo_alignment="center">
            </div>

        </div>

        <div class="additional-links">
            <p>Zaten hesabınız var mı? <a href="login.html">Giriş Yap</a></p>
        </div>

    </div>
    
</body>
</html>
