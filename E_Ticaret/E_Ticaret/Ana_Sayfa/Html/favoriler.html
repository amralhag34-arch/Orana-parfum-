<!DOCTYPE html>
<html lang="tr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Favorilerim</title>
    <link rel="icon" href="../img/favicon.png" type="image/png">

    <link rel="stylesheet" href="../Css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <style>
        :root {
            --primary-blue: #1e88e5;
            --dark-blue: #1565c0;
            --light-blue: #64b5f6;
            --pale-blue: #bbdefb;
            --hover-blue: #1976d2;
            --heart-red: #ff4081;
            --heart-hover: #f50057;
        }

        .favorites-container {
            max-width: 1200px;
            margin: 2rem auto;
            padding: 0 20px;
        }

        .page-title {
            text-align: center;
            color: var(--dark-blue);
            margin: 2rem 0;
            font-size: 2.5rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            font-weight: 600;
            border-bottom: 3px solid var(--light-blue);
            padding-bottom: 1rem;
            width: fit-content;
            margin-left: auto;
            margin-right: auto;
        }

        .favorites-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 2rem;
            padding: 1rem;
        }

        .favorite-card {
            background: white;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(30, 136, 229, 0.1);
            overflow: hidden;
            transition: all 0.3s ease;
            border: 1px solid var(--pale-blue);
            position: relative;
        }

        .favorite-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 25px rgba(30, 136, 229, 0.2);
        }

        .product-image {
            width: 100%;
            height: 70%;
            object-fit: cover;
            border-radius: 4px;
        }


        .favorite-card:hover .product-image {
            transform: scale(1.05);
        }

        .product-info {
            padding: 1.5rem;
            background: white;
        }

        .product-name {
            font-size: 1.2rem;
            color: var(--dark-blue);
            margin-bottom: 0.8rem;
            font-weight: 600;
        }

        .product-description {
            color: #546e7a;
            font-size: 0.95rem;
            margin-bottom: 1rem;
            line-height: 1.5;
        }

        .product-price {
            font-size: 1.3rem;
            color: var(--primary-blue);
            font-weight: bold;
            margin-bottom: 1rem;
        }

        .card-actions {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-top: 1rem;
            border-top: 1px solid var(--pale-blue);
        }

        .add-to-cart {
            padding: 0.8rem 1.5rem;
            background: var(--primary-blue);
            color: white;
            text-decoration: none;
            border-radius: 6px;
            transition: all 0.3s ease;
            font-weight: 500;
            border: none;
            cursor: pointer;
        }

        .add-to-cart:hover {
            background: var(--hover-blue);
            transform: translateY(-2px);
        }

        .remove-favorite {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: white;
            border: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
            color: var(--heart-red);
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }

        .remove-favorite:hover {
            background: var(--heart-red);
            color: white;
            transform: scale(1.1);
        }

        .favorite-badge {
            position: absolute;
            top: 1rem;
            right: 1rem;
            background: white;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
            z-index: 1;
        }

        .empty-favorites {
            text-align: center;
            padding: 4rem 2rem;
            background: white;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(30, 136, 229, 0.1);
        }

        .empty-favorites i {
            font-size: 4rem;
            color: var(--pale-blue);
            margin-bottom: 1rem;
        }

        .empty-favorites h2 {
            color: var(--dark-blue);
            margin-bottom: 1rem;
        }

        .empty-favorites p {
            color: #546e7a;
            margin-bottom: 2rem;
        }

        .shop-now-btn {
            display: inline-block;
            padding: 1rem 2rem;
            background: var(--primary-blue);
            color: white;
            text-decoration: none;
            border-radius: 6px;
            transition: all 0.3s ease;
            font-weight: 500;
        }

        .shop-now-btn:hover {
            background: var(--hover-blue);
            transform: translateY(-2px);
        }

        @media (max-width: 768px) {
            .favorites-grid {
                grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
                gap: 1.5rem;
            }

            .page-title {
                font-size: 2rem;
            }

            .product-image {
                height: 250px;
            }
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .favorite-card {
            animation: fadeIn 0.5s ease forwards;
        }
    </style>
</head>

<body>
    <header id="header">
        <a href="index.html" class="logo"> <img src="../img/profile.png" alt="logo"></a>

        <div class="research">
            <form onsubmit="event.preventDefault();">
                <label for="search-input">
                    <i class="fa-solid fa-magnifying-glass"></i>
                </label>
                <input type="text" id="search-input" placeholder="Search...">
            </form>
        </div>

        <nav id="navbar">
            <ul>
                <li><a href="erkek.html">Erkek</a></li>
                <li><a href="Kadin.html">Kadın</a></li>
                <li><a href="../Html/index.html">Anasayfa</a></li>
                <li><a href="markalar.html">Markalar</a></li>
                <li><a href="#Hakkinda">Hakkında</a></li>
            </ul>
        </nav>

        <div id="icons">
            <a href="file:///D:/E_Ticaret/Giris_sayfa/Html/login.html"><i class="fa-regular fa-user"></i></a>
            <a href="favoriler.html"><i class="fa-regular fa-heart"></i></a>
            <a href="Sepete.html"><i class="fa-solid fa-cart-shopping"></i></a>
        </div>
    </header>

    <main class="favorites-container">
        <h1 class="page-title">Favorilerim</h1>
        <div id="favorites-content"></div>
    </main>

    <script>
        document.addEventListener('DOMContentLoaded', function () {
            const favoritesContainer = document.getElementById('favorites-content');
            let favorites = JSON.parse(localStorage.getItem('favorites')) || [];

            function updateFavorites() {
                if (favorites.length === 0) {
                    favoritesContainer.innerHTML = `
                        <div class="empty-favorites">
                            <i class="far fa-heart"></i>
                            <h2>Henüz Favori Ürününüz Yok</h2>
                            <p>Beğendiğiniz ürünleri favorilerinize ekleyerek daha sonra kolayca ulaşabilirsiniz.</p>
                            <a href="index.html" class="shop-now-btn">Alışverişe Başla</a>
                        </div>
                    `;
                } else {
                    favoritesContainer.innerHTML = `
                        <div class="favorites-grid">
                            ${favorites.map(product => `
                                <div class="favorite-card" data-id="${product.id}">
                                    <img src="${product.image}" alt="${product.name}" class="product-image">
                                    <div class="product-info">
                                        <h3 class="product-name">${product.name}</h3>
                                        <p class="product-description">${product.description}</p>
                                        <div class="product-price">${product.price} TL</div>
                                        <div class="card-actions">
                                            <button class="add-to-cart">
                                                <i class="fas fa-shopping-cart"></i> Sepete Ekle
                                            </button>
                                            <button class="remove-favorite">
                                                <i class="fas fa-heart"></i>
                                            </button>
                                        </div>
                                    </div>
                                </div>
                            `).join('')}
                        </div>
                    `;

                    document.querySelectorAll('.remove-favorite').forEach(button => {
                        button.addEventListener('click', function (e) {
                            const card = e.target.closest('.favorite-card');
                            const productId = card.dataset.id;
                            favorites = favorites.filter(product => product.id !== productId);
                            localStorage.setItem('favorites', JSON.stringify(favorites));
                            updateFavorites();
                        });
                    });

                    document.querySelectorAll('.add-to-cart').forEach(button => {
                        button.addEventListener('click', function (e) {
                            const card = e.target.closest('.favorite-card');
                            const productId = card.dataset.id;
                            const product = favorites.find(p => p.id === productId);

                            let cart = JSON.parse(localStorage.getItem('cart')) || [];
                            cart.push({ ...product, quantity: 1 });
                            localStorage.setItem('cart', JSON.stringify(cart));

                            alert('Ürün sepete eklendi!');
                        });
                    });
                }
            }

            updateFavorites();
        });
    </script>

</body>

</html>
